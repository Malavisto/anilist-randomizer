name: CI

on:
  push:
    branches: [main, 'renovate/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - name: Verify static export
        run: test -s out/index.html && test -d out/_next/static

  container:
    name: Container checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: anilist-randomizer:ci
          cache-from: type=gha,scope=ci
          cache-to: type=gha,mode=max,scope=ci
      - name: Verify nginx serves the exported app and its assets
        run: |
          docker run -d --name static-site -p 8080:80 anilist-randomizer:ci
          trap 'docker logs static-site; docker rm -f static-site' EXIT
          curl --fail --retry 10 --retry-all-errors --retry-delay 1 http://localhost:8080/ -o /tmp/index.html
          grep -q 'Random Anime Picker' /tmp/index.html
          asset=$(grep -oE '/_next/static/[^" ]+\.css' /tmp/index.html | head -1)
          test -n "$asset"
          curl --fail "http://localhost:8080$asset" -o /dev/null
